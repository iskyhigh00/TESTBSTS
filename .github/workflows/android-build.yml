name: build

on:
  push:
    branches: [main]
    paths:
      - "fase3-android-monitor/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APK_PUBLISH_TOKEN: ${{ secrets.APK_PUBLISH_TOKEN }}
      APK_REPO: ${{ secrets.APK_REPO }}
      APK_READ_TOKEN: ${{ secrets.APK_READ_TOKEN }}
      SUPA_URL: ${{ secrets.SUPA_URL }}
      SUPA_KEY: ${{ secrets.SUPA_KEY }}
    defaults:
      run:
        working-directory: fase3-android-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: sdk licenses
        working-directory: .
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/k.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/k.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: assemble
        run: gradle assembleRelease --stacktrace

      - name: files
        run: |
          cp app/build/outputs/apk/release/app-release.apk CashflowMonitor.apk
          grep -m1 'versionName' app/build.gradle.kts \
            | sed -E 's/.*"([0-9.]+)".*/\1/' > version.txt

      - name: publish
        if: ${{ env.APK_PUBLISH_TOKEN != '' && env.APK_REPO != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.APK_REPO }}
          token: ${{ env.APK_PUBLISH_TOKEN }}
          tag_name: monitor-apk
          name: build
          files: |
            fase3-android-monitor/CashflowMonitor.apk
            fase3-android-monitor/version.txt
